name: validate

on:
  pull_request:
    paths:
      - cookbook.json
      - scripts/validate.py
      - .github/workflows/validate.yml
  push:
    branches: [main]
    paths:
      - cookbook.json
      - scripts/validate.py
      - .github/workflows/validate.yml

jobs:
  cookbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
